services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: orkystra
      POSTGRES_USER: orkystra
      POSTGRES_PASSWORD: orkystra
    volumes:
      - postgres-data:/var/lib/postgresql/data

  mqtt:
    image: eclipse-mosquitto:2
    volumes:
      - ./mqtt/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  qdrant:
    image: qdrant/qdrant:v1.15.5
    volumes:
      - qdrant-data:/qdrant/storage

  api:
    build:
      context: ..
      dockerfile: backend/src/Orkystra.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Security__ApiKey: expected-local-dev-key
      TenantAccess__DefaultTenantId: north-hub-demo
      OperationalPersistence__Provider: postgres
      OperationalPersistence__ConnectionString: Host=postgres;Port=5432;Database=orkystra;Username=orkystra;Password=orkystra
      EventBackbone__BrokerUrl: mqtt://mqtt:1883
      AiService__BaseUrl: http://ai-service:8001
      OptimizationService__BaseUrl: http://optimization-service:8002
      Dependencies__Postgres: postgres://postgres:5432/orkystra
      Dependencies__Mqtt: mqtt://mqtt:1883
      Dependencies__Qdrant: http://qdrant:6333
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - mqtt
      - qdrant

  ai-service:
    build:
      context: ..
      dockerfile: python-services/ai-service/Dockerfile
    ports:
      - "8001:8001"

  optimization-service:
    build:
      context: ..
      dockerfile: python-services/optimization-service/Dockerfile
    ports:
      - "8002:8002"

  web:
    build:
      context: ..
      dockerfile: frontend/web/Dockerfile
    ports:
      - "8081:80"
    depends_on:
      - api

volumes:
  postgres-data:
  qdrant-data:
