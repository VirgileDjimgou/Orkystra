[project]
name = "orkystra-python-services"
version = "0.1.0"
description = "Python service skeletons for Orkystra AI and optimization services."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116.0",
  "uvicorn[standard]>=0.35.0",
  "langgraph>=0.6.0",
  "ortools>=9.14.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28.0",
  "pytest>=8.4.0",
]

[build-system]
requires = ["setuptools>=80.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = []

[tool.setuptools.packages.find]
where = ["ai-service/src", "optimization-service/src"]
include = ["orkystra_ai_service*", "orkystra_optimization_service*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
