name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-services:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python-services
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python-services/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: python -m pytest -v

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - run: dotnet test tests/backend/Orkystra.Domain.Tests
      - run: dotnet test tests/backend/Orkystra.Integration.Tests

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/web/package-lock.json
      - run: npm ci
      - run: npm run build
